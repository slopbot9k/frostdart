name: Test native assets

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.0'
      - uses: dtolnay/rust-toolchain@1.99.1
        if: matrix.os == 'ubuntu-24.04'
      # The hook builds through the Nix flake; before the first native
      # release that is the only path, and it is unavailable on Windows.
      - uses: DeterminateSystems/nix-installer-action@v23
        if: runner.os != 'Windows'
      - run: dart pub get --no-example
      - run: dart analyze lib test hook tool
      - name: Check whether a native release is recorded
        id: release
        shell: bash
        run: echo "recorded=$(jq -r '.nativeVersion != null' hook/prebuilt_hashes.json)" >> "$GITHUB_OUTPUT"
      - run: dart test
        if: runner.os != 'Windows' || steps.release.outputs.recorded == 'true'
      - name: Rust tests
        if: matrix.os == 'ubuntu-24.04'
        working-directory: src/serai/hrf
        run: cargo test --locked --workspace --exclude bitcoin-serai
