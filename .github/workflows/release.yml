name: Test native assets

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.0'
      - uses: dtolnay/rust-toolchain@1.99.1
      - run: dart pub get --no-example
      - run: dart analyze lib test hook tool
      - run: dart test
      - name: Build twice from different directories and compare
        shell: bash
        run: tool/ci_annotate.sh "two-directory check" dart run tool/check_reproducibility.dart
      - name: Rust tests
        if: matrix.os == 'ubuntu-24.04'
        working-directory: src/serai/hrf
        run: cargo test --locked --workspace --exclude bitcoin-serai
